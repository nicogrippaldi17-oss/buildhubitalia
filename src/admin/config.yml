# Decap CMS Config — Build Hub

backend:
  name: github
  repo: nicogrippaldi17-oss/buildhubitalia
  branch: main
  base_url: https://buildhubitalia.com
  auth_endpoint: api/auth

media_folder: "src/img/projects"
public_folder: "/img/projects"
site_url: "https://buildhubitalia.com"
display_url: "https://buildhubitalia.com"
logo_url: "/img/logo.png"

locale: "it"

collections:
  - name: "pages_it"
    label: "Pagine IT"
    label_singular: "Pagina IT"
    description: "⚠️ Le modifiche qui NON si riflettono sulla versione EN. Dopo aver modificato una pagina IT, aggiorna anche la corrispondente in Pages EN."
    create: false
    delete: false
    files:
      - label: "Homepage"
        name: "index"
        file: "src/index.njk"
        fields:
          - { label: "Titolo SEO", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Sottotitolo Hero", name: "hero_subtitle", widget: "string" }
          - { label: "Tagline Hero", name: "hero_tagline", widget: "text" }
          - { label: "Testo Bottone Hero", name: "hero_cta", widget: "string" }
          - { label: "Titolo Sezione Metodo", name: "method_title", widget: "string", default: "Il nostro metodo" }
          - { label: "Titolo Sezione Servizi", name: "services_title", widget: "string", default: "I nostri servizi" }
          - label: "Valori"
            name: "valori"
            widget: "list"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
          - { label: "Label Stats Progetti", name: "stat_projects_label", widget: "string", default: "Progetti Completati" }
          - { label: "Label Stats Anni", name: "stat_years_label", widget: "string", default: "Anni di Esperienza" }
          - { label: "Label Stats Servizi", name: "stat_services_label", widget: "string", default: "Servizi Offerti" }
          - { label: "Titolo CTA Finale", name: "cta_title", widget: "string" }
          - { label: "Testo CTA Finale", name: "cta_text", widget: "text" }
          - { label: "Bottone CTA", name: "cta_button", widget: "string" }
          - { label: "Titolo Territorio", name: "territorio_title", widget: "string", default: "Radicati in Sicilia" }
          - { label: "Testo Territorio", name: "territorio_text", widget: "text", default: "Operiamo sull'intero territorio siciliano con una conoscenza radicata delle specificità locali, del quadro normativo regionale e delle migliori pratiche costruttive dell'area mediterranea." }

      - label: "Chi Siamo"
        name: "chi-siamo"
        file: "src/chi-siamo.njk"
        fields:
          - { label: "Titolo SEO", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Titolo Hero", name: "hero_title", widget: "string" }
          - { label: "Sottotitolo Hero", name: "hero_subtitle", widget: "string" }
          - { label: "Titolo Storia", name: "storia_title", widget: "string" }
          - { label: "Paragrafo 1 Storia", name: "storia_p1", widget: "text" }
          - { label: "Paragrafo 2 Storia", name: "storia_p2", widget: "text" }
          - { label: "Titolo Approccio", name: "approccio_title", widget: "string" }
          - { label: "Intro Approccio", name: "approccio_intro", widget: "text" }
          - label: "Punti Approccio"
            name: "approccio_items"
            widget: "list"
            field: { label: "Testo", name: "text", widget: "string" }
          - { label: "Titolo Visione", name: "visione_title", widget: "string" }
          - { label: "Paragrafo 1 Visione", name: "visione_p1", widget: "text" }
          - { label: "Paragrafo 2 Visione", name: "visione_p2", widget: "text" }
          - { label: "Titolo Missione", name: "missione_title", widget: "string" }
          - { label: "Paragrafo 1 Missione", name: "missione_p1", widget: "text" }
          - { label: "Paragrafo 2 Missione", name: "missione_p2", widget: "text" }
          - { label: "Titolo Valori", name: "valori_title", widget: "string" }
          - label: "Card Valori"
            name: "valori_cards"
            widget: "list"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
          - { label: "Titolo CTA", name: "cta_title", widget: "string" }
          - { label: "Testo CTA", name: "cta_text", widget: "text" }
          - { label: "Bottone CTA", name: "cta_button", widget: "string" }
          - { label: "Link CTA", name: "cta_link", widget: "string" }
          - { label: "Titolo Territorio", name: "territorio_title", widget: "string" }
          - { label: "Testo Territorio", name: "territorio_text", widget: "text" }

      - label: "Servizi"
        name: "servizi"
        file: "src/servizi.njk"
        fields:
          - { label: "Titolo SEO", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Titolo Hero", name: "hero_title", widget: "string" }
          - { label: "Sottotitolo Hero", name: "hero_subtitle", widget: "string" }
          - { label: "Titolo CTA Finale", name: "cta_final_title", widget: "string", default: "Non sai qual è il servizio giusto per te?" }
          - { label: "Testo CTA Finale", name: "cta_final_text", widget: "text", default: "Raccontaci il tuo progetto. Ti ascolteremo, analizzeremo le tue esigenze e ti guideremo verso la soluzione migliore, senza impegno." }
          - { label: "Bottone CTA Finale", name: "cta_final_button", widget: "string", default: "Parlaci del tuo progetto" }

      - label: "Progetti"
        name: "progetti"
        file: "src/progetti.njk"
        fields:
          - { label: "Titolo SEO", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Titolo Hero", name: "hero_title", widget: "string" }
          - { label: "Sottotitolo Hero", name: "hero_subtitle", widget: "string" }

      - label: "Contatti"
        name: "contatti"
        file: "src/contatti.njk"
        fields:
          - { label: "Titolo SEO", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Titolo Hero", name: "hero_title", widget: "string" }
          - { label: "Sottotitolo Hero", name: "hero_subtitle", widget: "string" }
          - { label: "Titolo Cosa Succede", name: "process_title", widget: "string", default: "Cosa succede dopo" }
          - { label: "Titolo Step 1", name: "step1_title", widget: "string", default: "Raccontaci il tuo progetto" }
          - { label: "Testo Step 1", name: "step1_text", widget: "text", default: "Compila il form, scrivici una mail o chiamaci. Abbiamo bisogno di capire cosa vuoi realizzare, in che contesto e con quali aspettative." }
          - { label: "Titolo Step 2", name: "step2_title", widget: "string", default: "Analizziamo la richiesta" }
          - { label: "Testo Step 2", name: "step2_text", widget: "text", default: "Valutiamo il contesto tecnico e normativo, le criticità e le opportunità. Se necessario, fissiamo un incontro senza impegno per approfondire." }
          - { label: "Titolo Step 3", name: "step3_title", widget: "string", default: "Ricevi piano e preventivo" }
          - { label: "Testo Step 3", name: "step3_text", widget: "text", default: "Ti presentiamo un percorso chiaro, con tempistiche, fasi operative e una stima trasparente dei costi. Senza sorprese, senza vincoli." }

      - label: "Contatti Footer"
        name: "contatti-footer"
        file: "src/_data/contact.json"
        fields:
          - { label: "Indirizzo", name: "address", widget: "string" }
          - { label: "Telefono", name: "phone", widget: "string" }
          - { label: "Telefono 2", name: "phone2", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string" }

  - name: "pages_en"
    label: "Pages EN"
    label_singular: "Page EN"
    description: "⚠️ Changes here do NOT apply to the IT version. After editing a page, also update the corresponding one in Pagine IT."
    create: false
    delete: false
    files:
      - label: "Homepage"
        name: "index"
        file: "src/en/index.njk"
        fields:
          - { label: "SEO Title", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string" }
          - { label: "Hero Tagline", name: "hero_tagline", widget: "text" }
          - { label: "Hero Button Text", name: "hero_cta", widget: "string" }
          - { label: "Method Section Title", name: "method_title", widget: "string", default: "Our method" }
          - { label: "Services Section Title", name: "services_title", widget: "string", default: "Our services" }
          - label: "Values"
            name: "valori"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Stats Label Projects", name: "stat_projects_label", widget: "string", default: "Completed Projects" }
          - { label: "Stats Label Years", name: "stat_years_label", widget: "string", default: "Years of Experience" }
          - { label: "Stats Label Services", name: "stat_services_label", widget: "string", default: "Services Offered" }
          - { label: "CTA Title", name: "cta_title", widget: "string" }
          - { label: "CTA Text", name: "cta_text", widget: "text" }
          - { label: "CTA Button", name: "cta_button", widget: "string" }
          - { label: "Territory Title", name: "territorio_title", widget: "string", default: "Rooted in Sicily" }
          - { label: "Territory Text", name: "territorio_text", widget: "text", default: "We operate throughout Sicily with deep-rooted knowledge of local specificities, the regional regulatory framework and the best construction practices of the Mediterranean area." }

      - label: "About Us"
        name: "about"
        file: "src/en/about.njk"
        fields:
          - { label: "SEO Title", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string" }
          - { label: "Story Title", name: "storia_title", widget: "string" }
          - { label: "Story Paragraph 1", name: "storia_p1", widget: "text" }
          - { label: "Story Paragraph 2", name: "storia_p2", widget: "text" }
          - { label: "Approach Title", name: "approccio_title", widget: "string" }
          - { label: "Approach Intro", name: "approccio_intro", widget: "text" }
          - label: "Approach Items"
            name: "approccio_items"
            widget: "list"
            field: { label: "Text", name: "text", widget: "string" }
          - { label: "Vision Title", name: "visione_title", widget: "string" }
          - { label: "Vision Paragraph 1", name: "visione_p1", widget: "text" }
          - { label: "Vision Paragraph 2", name: "visione_p2", widget: "text" }
          - { label: "Mission Title", name: "missione_title", widget: "string" }
          - { label: "Mission Paragraph 1", name: "missione_p1", widget: "text" }
          - { label: "Mission Paragraph 2", name: "missione_p2", widget: "text" }
          - { label: "Values Title", name: "valori_title", widget: "string" }
          - label: "Value Cards"
            name: "valori_cards"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "CTA Title", name: "cta_title", widget: "string" }
          - { label: "CTA Text", name: "cta_text", widget: "text" }
          - { label: "CTA Button", name: "cta_button", widget: "string" }
          - { label: "CTA Link", name: "cta_link", widget: "string" }
          - { label: "Territory Title", name: "territorio_title", widget: "string" }
          - { label: "Territory Text", name: "territorio_text", widget: "text" }

      - label: "Services"
        name: "services"
        file: "src/en/services.njk"
        fields:
          - { label: "SEO Title", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string" }
          - { label: "CTA Final Title", name: "cta_final_title", widget: "string", default: "Not sure which service is right for you?" }
          - { label: "CTA Final Text", name: "cta_final_text", widget: "text", default: "Tell us about your project. We will listen, analyse your needs and guide you towards the best solution, with no obligation." }
          - { label: "CTA Final Button", name: "cta_final_button", widget: "string", default: "Tell us about your project" }

      - label: "Projects"
        name: "projects"
        file: "src/en/projects.njk"
        fields:
          - { label: "SEO Title", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string" }

      - label: "Contact"
        name: "contact"
        file: "src/en/contact.njk"
        fields:
          - { label: "SEO Title", name: "title", widget: "string" }
          - { label: "Meta Description", name: "description", widget: "text", required: false }
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "string" }
          - { label: "Process Title", name: "process_title", widget: "string", default: "What happens next" }
          - { label: "Step 1 Title", name: "step1_title", widget: "string", default: "Tell us about your project" }
          - { label: "Step 1 Text", name: "step1_text", widget: "text", default: "Fill in the form, send us an email or give us a call. We need to understand what you want to achieve, in what context and with what expectations." }
          - { label: "Step 2 Title", name: "step2_title", widget: "string", default: "We analyse your request" }
          - { label: "Step 2 Text", name: "step2_text", widget: "text", default: "We assess the technical and regulatory context, the challenges and the opportunities. If needed, we schedule a no-obligation meeting to go deeper into the details." }
          - { label: "Step 3 Title", name: "step3_title", widget: "string", default: "Receive plan and quote" }
          - { label: "Step 3 Text", name: "step3_text", widget: "text", default: "We present you with a clear roadmap, complete with timelines, operational phases and a transparent cost estimate. No surprises, no strings attached." }

  - name: "services_it"
    label: "Servizi IT"
    label_singular: "Servizio"
    folder: "src/services_it"
    create: true
    delete: true
    extension: "md"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Descrizione", name: "description", widget: "text" }
      - label: "Icona"
        name: "icon"
        widget: "select"
        options: ["management", "permits", "supervision", "safety", "economics", "energy", "consulting", "network"]
        default: "management"
      - { label: "Slug (ID per ancoraggio)", name: "slug", widget: "string" }
      - label: "Caratteristiche"
        name: "features"
        widget: "list"
        fields:
          - { label: "Voce", name: "text", widget: "string" }
          - { label: "Tooltip (spiegazione al ?)", name: "tip", widget: "string", required: false }
      - { label: "Ordine", name: "order", widget: "number", default: 1 }

  - name: "services_en"
    label: "Services EN"
    label_singular: "Service"
    folder: "src/services_en"
    create: true
    delete: true
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Icon"
        name: "icon"
        widget: "select"
        options: ["management", "permits", "supervision", "safety", "economics", "energy", "consulting", "network"]
        default: "management"
      - { label: "Slug (anchor ID)", name: "slug", widget: "string" }
      - label: "Features"
        name: "features"
        widget: "list"
        fields:
          - { label: "Item", name: "text", widget: "string" }
          - { label: "Tooltip (? explanation)", name: "tip", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }

  - name: "projects_it"
    label: "Progetti IT"
    label_singular: "Progetto"
    folder: "src/projects_it"
    create: true
    delete: true
    extension: "md"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Descrizione", name: "description", widget: "text" }
      - { label: "Immagine", name: "image", widget: "image", required: false }
      - { label: "Categoria", name: "category", widget: "string" }
      - { label: "Pubblicato", name: "published", widget: "boolean", default: true, required: false }
      - { label: "Ordine", name: "order", widget: "number", default: 1 }

  - name: "projects_en"
    label: "Projects EN"
    label_singular: "Project"
    folder: "src/projects_en"
    create: true
    delete: true
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Published", name: "published", widget: "boolean", default: true, required: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }
